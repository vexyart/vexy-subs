# this_file: src_docs/mkdocs.yml
site_name: vexy-subs
site_description: Local speaker-coloured video subtitles with contextual hints, punctuation restoration and LLM translation
site_url: https://vexy.dev/vexy-subs/
repo_url: https://github.com/vexyart/vexy-subs
repo_name: vexyart/vexy-subs
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Transcription: transcription.md
  - Beautification: beautify.md
  - Translation: translation.md
  - Configuration: configuration.md
  - Command reference: cli.md
  - Python API: api.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Changelog: changelog.md
