# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "vexy-subs"
dynamic = ["version"]
description = "Local speaker-coloured video subtitles with contextual hints, punctuation restoration and LLM translation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adam Twardoch", email = "adam+github@twardoch.com" }]
keywords = ["subtitles", "captions", "transcription", "diarization", "qwen", "webvtt", "translation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fire>=0.7.1,<0.8",
    "pysubs2>=1.9,<2",
    "webvtt-py>=0.5.1,<0.6",
    "intervaltree>=3.1,<4",
    "langid>=1.1.6,<2",
    "python-dotenv>=1.1,<2",
    "platformdirs>=4.3,<5",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
    "nltk>=3.9,<4",
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
apple = ["mlx-whisper==0.4.3", "mlx-audio==0.5.7", "deepmultilingualpunctuation==1.0.1", "torch>=2.6", "transformers>=5.14,<6", "soundfile>=0.13"]
native = ["deepmultilingualpunctuation==1.0.1", "torch>=2.6", "transformers>=5.14,<6"]
test = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12", "build>=1.2", "twine>=6"]
cluster = ["diarize==0.1.2"]

[project.scripts]
vexy-subs = "vexy_subs.cli:main"

[project.urls]
Homepage = "https://github.com/vexyart/vexy-subs"
Documentation = "https://vexy.dev/vexy-subs/"
Repository = "https://github.com/vexyart/vexy-subs"
Issues = "https://github.com/vexyart/vexy-subs/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/vexy_subs/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_subs"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml", "/CHANGELOG.md", "/DEPENDENCIES.md", "/test.sh"]
exclude = [".omc", "__pycache__", "*.wav", "*.mp4", "*.m4a"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
